<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>SUPERHOT</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="Build/SuperHotWebPort.loader.js"></script>
    <script>
      var unityInstance;
      window.addEventListener("load", function () {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: "Build/data-manifest.json",
            frameworkUrl: "Build/SuperHotWebPort.framework.js.gz",
            codeUrl: "Build/SuperHotWebPort.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "SuperHot-WebPort",
            productVersion: "1.0",
          }, (progress) => {
            // Loading progress if needed
          }).then((instance) => {
            unityInstance = instance;
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      });
    </script>
</head>

<body style="overflow:hidden; margin:0; padding:0; background: #000;">
    <div id="unity-container" style="width: 100vw; height: 100vh; position: absolute;">
      <canvas id="unity-canvas" style="width: 100%; height: 100%; background: #000;"></canvas>
    </div>
    <script>
      var loaderUrl = "Build/SuperHotWebPort.loader.js";
    </script>
</body>

</html>
