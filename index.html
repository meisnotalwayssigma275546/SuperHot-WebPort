<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPERHOT</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #unity-canvas { width:100vw; height:100vh; display:block; background:#000; }
  </style>
  <script src="Build/embedded-resources.js"></script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script src="Build/SuperHotWebPort.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/data-manifest.json",
      frameworkUrl: "Build/SuperHotWebPort.framework.js.gz",
      codeUrl: "Build/SuperHotWebPort.wasm.gz",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "SuperHot-WebPort",
      productVersion: "1.0"
    }).then(function (instance) {
      window.unityInstance = instance;
    }).catch(function (e) { alert(e); });
  </script>
</body>
</html>
