<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPERHOT</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #unity-canvas { width:100vw; height:100vh; display:block; background:#000; }
    #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
              color:#fff; font:16px monospace; text-align:center; padding:20px; pointer-events:none; }
  </style>
  <script src="Build/embedded-resources.js"></script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="status">Loading...</div>

  <script src="Build/SuperHotWebPort.loader.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const setStatus = (t) => { statusEl.textContent = t; };

    // Downloads every chunk in order, joins them, gunzips, returns a blob URL
    async function loadChunkedData(manifestUrl) {
      const manifest = await (await fetch(manifestUrl)).json();
      const parts = manifest.parts;
      let i = 0, reader = null;

      const joined = new ReadableStream({
        async pull(controller) {
          while (true) {
            if (!reader) {
              if (i >= parts.length) { controller.close(); return; }
              setStatus("Downloading game data... " + Math.round((i / parts.length) * 100) + "%");
              const res = await fetch(parts[i++]);
              if (!res.ok) throw new Error("Failed to load " + res.url + " (" + res.status + ")");
              reader = res.body.getReader();
            }
            const { done, value } = await reader.read();
            if (done) { reader = null; continue; }
            controller.enqueue(value);
            return;
          }
        }
      });

      const gz = (manifest.source || "").endsWith(".gz");
      const stream = gz ? joined.pipeThrough(new DecompressionStream("gzip")) : joined;
      const blob = await new Response(stream).blob();
      return URL.createObjectURL(blob);
    }

    (async function () {
      try {
        const dataUrl = await loadChunkedData("Build/data-manifest.json");
        setStatus("Starting...");
        window.unityInstance = await createUnityInstance(
          document.querySelector("#unity-canvas"),
          {
            dataUrl: dataUrl,
            frameworkUrl: "Build/SuperHotWebPort.framework.js.gz",
            codeUrl: "Build/SuperHotWebPort.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "SuperHot-WebPort",
            productVersion: "1.0"
          },
          (p) => setStatus("Loading " + Math.round(p * 100) + "%")
        );
        statusEl.style.display = "none";
      } catch (e) {
        setStatus("Error: " + (e && e.message ? e.message : e));
        console.error(e);
      }
    })();
  </script>
</body>
</html>
